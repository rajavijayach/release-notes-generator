name: Release Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Create release archive
        run: |
          mkdir -p release
          tar -czf release/release-notes-generator.tar.gz \
            gemini-extension.json \
            GEMINI.md \
            README.md \
            package.json \
            package-lock.json \
            dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/release-notes-generator.tar.gz
          generate_release_notes: true
